{{- $page := .page -}}
{{- $url := $page.Params.image_original -}}
{{- $alt := or $page.Params.description._content $page.Params.title (printf "Photo %s" (string $page.Params.photo_id)) -}}
<div class="swiper-slide" data-photo-url="{{ $page.RelPermalink }}"{{ if .current }} data-current="true"{{ else }} aria-hidden="true"{{ end }}>
  <div class="swiper-zoom-container">
    <img src="{{ $url }}" alt="{{ $alt }}" loading="{{ if .current }}eager{{ else }}lazy{{ end }}" decoding="async" crossorigin="anonymous" />
  </div>
</div>
