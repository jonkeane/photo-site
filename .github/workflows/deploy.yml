name: Build and Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  schedule:
    - cron: '0 0 * * 0,3' # Run weekly on Sunday and Wednesday at midnight UTC
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'preview'
          - 'production'
      refresh_background_image:
        description: 'On main only, clear the cached background image and download it again'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      preview_origin: ${{ steps.netlify_preview.outputs.preview_origin }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5

      - name: Run R2 importer
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: go run github.com/jonkeane/publish-to-r2/uploader/cmd/r2import@latest

      - name: Clear background image cache (main only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.refresh_background_image }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: 'assets',
            });

      - name: Restore background image cache
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: assets

      - name: Fetch background image
        if: steps.assets-cache.outputs.cache-hit != 'true'
        env:
          BACKGROUND_IMAGE_URL: https://jonkeane.link/background/background.jpg
        run: |
          mkdir -p assets/bg
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --connect-timeout 20 --max-time 120 \
            --output assets/bg/background.jpg \
            "$BACKGROUND_IMAGE_URL"
          test -s assets/bg/background.jpg
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Build Hugo site
        run: hugo --minify

      - name: Install netlify cli
        run: npm install -g netlify-cli
      
      - name: Deploy to Netlify (Production)
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production') }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod --no-build --dir=public
      
      - name: Deploy to Netlify (Preview)
        id: netlify_preview
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview') }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_ALIAS: ${{ github.event_name == 'pull_request' && format('PR{0}', github.event.pull_request.number) || format('manual-{0}', github.run_number) }}
        run: |
          netlify_output="$(
            netlify deploy --alias="$NETLIFY_DEPLOY_ALIAS" \
              --no-build --dir=public --json
          )"
          printf '%s\n' "$netlify_output"

          deploy_url="$(jq -er '.deploy_url' <<< "$netlify_output")"
          preview_origin="$(
            node -e \
              'process.stdout.write(new URL(process.argv[1]).origin)' \
              "$deploy_url"
          )"

          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "preview_origin=$preview_origin" >> "$GITHUB_OUTPUT"
      
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.netlify_preview.outputs.deploy_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = process.env.PREVIEW_URL;
            
            const comment = `## 🚀 Preview Deployment
            
            ✅ Preview deployed successfully!
            
            **Preview URL:** ${deployUrl}
            
            Built with commit: ${context.sha.substring(0, 7)}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  sync-preview-cors:
    needs: build-and-deploy
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'pull_request' && github.event.action == 'closed') ||
          (
            needs.build-and-deploy.result == 'success' &&
            (
              github.event_name == 'pull_request' ||
              (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: r2-preview-cors
      cancel-in-progress: false

    steps:
      - name: Add or remove preview origin in R2 CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PREVIEW_ORIGIN: ${{ needs.build-and-deploy.outputs.preview_origin }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CORS_ACTION: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'remove' || 'add' }}
        run: |
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET_NAME}/cors"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api_url" > cors-response.json

          if [ "$CORS_ACTION" = "add" ]; then
            test -n "$PREVIEW_ORIGIN"

            jq -e --arg origin "$PREVIEW_ORIGIN" '
              if .success != true
              then error((.errors // []) | tostring)
              else .result
              end
              | (.rules // []) as $rules
              | {
                  rules: (
                    if any($rules[]; .id == "netlify-previews")
                    then
                      $rules | map(
                        if .id == "netlify-previews"
                        then .allowed.origins = ((.allowed.origins + [$origin]) | unique)
                        else .
                        end
                      )
                    else
                      $rules + [{
                        id: "netlify-previews",
                        allowed: {
                          origins: [$origin],
                          methods: ["GET", "HEAD"]
                        }
                      }]
                    end
                  )
                }
            ' cors-response.json > cors-update.json
          else
            test -n "$PR_NUMBER"

            jq -e --arg pr_number "$PR_NUMBER" '
              if .success != true
              then error((.errors // []) | tostring)
              else .result
              end
              | {
                  rules: (
                    (.rules // [])
                    | map(
                        if .id == "netlify-previews"
                        then .allowed.origins |= map(
                          select(
                            (ascii_downcase | startswith("https://pr" + $pr_number + "--"))
                            | not
                          )
                        )
                        else .
                        end
                      )
                    | map(
                        select(
                          .id != "netlify-previews" or
                          (.allowed.origins | length) > 0
                        )
                      )
                  )
                }
            ' cors-response.json > cors-update.json
          fi

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @cors-update.json \
            "$api_url" |
            jq -e '
              if .success == true
              then .
              else error((.errors // []) | tostring)
              end
            '
